<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Информация о пользователе</title>
</head>
<body>
    <h1>Информация о пользователе</h1>
    <p th:text="|Привет дорогой, ${course.name}!|" />
    <p th:text="|Привет, ${course.email}!|" />

    <ul th:object="${course}">
        <li>Имя: <span th:text="*{name}"></span></li>
        <li>Адрес: <span th:text="*{email}"></span></li>
    </ul>

    <div th:inline="text">
    <h1>Значение в строке. Привет [[${course.name}]]!</h1>
    </div>


</body>
</html>
